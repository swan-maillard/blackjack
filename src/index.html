<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="preload">
<div id="boardGame">
    <header id="topBar">
        <div class="brand">Blackjack</div>
        <div class="stats">
            <div class="stat">
                <span class="label">Round</span>
                <span id="round">1</span>
            </div>
        </div>
    </header>

    <div id="deck" data-count="0">
        <div class="card deck-card">
            <div class="card-inner">
                <div class="card-face card-back"></div>
            </div>
        </div>
    </div>

    <div id="dealer">
        <div class="seat-label">Dealer</div>
        <div id="dealerHand" class="hand"></div>
    </div>

    <div id="player">
        <div id="playerHand" class="hand"></div>
        <div class="seat-label">You</div>
    </div>

    <div id="score"></div>

    <aside id="playerPanel">
        <div id="chipStack"></div>
        <div class="player-info">
            <div class="info-row">
                <span class="info-label">Bankroll</span>
                <span id="bankroll">$0</span>
            </div>
            <div class="info-row">
                <span class="info-label">Bet</span>
                <span id="bet">$0</span>
            </div>
        </div>
    </aside>

    <div id="actions">
        <button id="hitButton" class="actionButton disabled">
            <span>Hit</span>
        </button>
        <button id="standButton" class="actionButton disabled">
            <span>Stand</span>
        </button>
        <button id="doubleButton" class="actionButton disabled">
            <span>Double</span>
        </button>
        <button id="splitButton" class="actionButton disabled">
            <span>Split</span>
        </button>
    </div>

    <div id="betPanel" class="hidden">
        <h2>Place your bet</h2>
        <div class="chip-row">
            <button class="chip chip-5" data-value="5"><span>5</span></button>
            <button class="chip chip-25" data-value="25"><span>25</span></button>
            <button class="chip chip-100" data-value="100"><span>100</span></button>
            <button class="chip chip-500" data-value="500"><span>500</span></button>
        </div>
        <div class="bet-actions">
            <button id="clearBetButton" class="secondaryButton">Clear</button>
            <button id="dealButton" class="primaryButton" disabled>Deal</button>
        </div>
        <div class="bet-hint">Minimum bet $5</div>
    </div>

    <div id="gameOver" class="hidden">
        <div class="gameOver-card">
            <h1>Game Over</h1>
            <p>You're out of chips.</p>
            <button id="newGameButton" class="primaryButton">New game</button>
        </div>
    </div>
</div>
</body>
</html>
